<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SportSpace — Horarios</title>
    <link rel="stylesheet" href="/propietario/shared/propietario.css"/>
    <link rel="stylesheet" href="/propietario/horarios/horarios.css"/>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="layout">
    <div id="sidebar-container"></div>
    <div class="main">
        <header class="header">
            <div class="header-left">
                <button class="hamburger" id="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div class="breadcrumb"><span>Propietario</span><span class="bc-sep">›</span><span class="bc-page" id="bcPage">Horarios</span></div>
            </div>
            <div class="header-right">
                <button class="notif-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
                <div class="user-dropdown-wrap" id="userDropdownWrap">
                    <button class="header-user" id="headerUser"><div class="header-avatar" id="headerAvatar">P</div><div class="header-user-info"><div class="header-user-name" id="headerName">—</div><div class="header-user-role" id="headerRole">Propietario</div></div><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-info"><div class="dropdown-info-name" id="dropdownName">—</div><div class="dropdown-info-role" id="dropdownRole">—</div><div class="dropdown-info-email" id="dropdownEmail">—</div></div>
                        <button class="dropdown-item danger" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="page-header-row">
                <div><h1>Horarios</h1><p>Define los horarios de atención de cada cancha</p></div>
                <select class="form-select" id="selectorCancha" style="height:36px;font-size:13px;min-width:220px" onchange="cambiarCancha(this.value)">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div id="contenidoHorarios">
                <div class="loading-state"><div class="spinner"></div> Cargando...</div>
            </div>
        </div>
    </div>
</div>
<script src="/api.js"></script>
<script src="/propietario/shared/propietario.js"></script>
<script src="/propietario/horarios/horarios.js"></script>
</body>
</html>
