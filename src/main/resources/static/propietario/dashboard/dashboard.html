<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SportSpace — Dashboard Propietario</title>
    <link rel="stylesheet" href="/propietario/shared/propietario.css"/>
    <link rel="stylesheet" href="/propietario/dashboard/dashboard.css"/>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="layout">
    <div id="sidebar-container"></div>

    <div class="main">
        <header class="header">
            <div class="header-left">
                <button class="hamburger" id="hamburger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6"  x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="breadcrumb">
                    <span>Propietario</span>
                    <span class="bc-sep">›</span>
                    <span class="bc-page" id="bcPage">Dashboard</span>
                </div>
            </div>
            <div class="header-right">
                <button class="notif-btn" title="Notificaciones">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <div class="user-dropdown-wrap" id="userDropdownWrap">
                    <button class="header-user" id="headerUser">
                        <div class="header-avatar" id="headerAvatar">P</div>
                        <div class="header-user-info">
                            <div class="header-user-name" id="headerName">Cargando...</div>
                            <div class="header-user-role" id="headerRole">Propietario</div>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-info">
                            <div class="dropdown-info-name"  id="dropdownName">—</div>
                            <div class="dropdown-info-role"  id="dropdownRole">—</div>
                            <div class="dropdown-info-email" id="dropdownEmail">—</div>
                        </div>
                        <button class="dropdown-item danger" onclick="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            Cerrar sesión
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="page-header-row">
                <div>
                    <h1 id="welcomeMsg">Bienvenido 👋</h1>
                    <p id="fechaHoy">—</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-card-top">
                        <div class="stat-icon si-green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        </div>
                        <span class="stat-trend trend-up" id="trendIngresos">—</span>
                    </div>
                    <div class="stat-label">Ingresos del mes</div>
                    <div class="stat-val" id="statIngresos">—</div>
                    <div class="stat-sub" id="statIngresosSub">cargando...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-top">
                        <div class="stat-icon si-blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        </div>
                    </div>
                    <div class="stat-label">Reservas hoy</div>
                    <div class="stat-val" id="statReservasHoy">—</div>
                    <div class="stat-sub" id="statReservasHoySub">cargando...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-top">
                        <div class="stat-icon si-orange">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        </div>
                    </div>
                    <div class="stat-label">Canchas activas</div>
                    <div class="stat-val" id="statCanchas">—</div>
                    <div class="stat-sub" id="statCanchasSub">cargando...</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-top">
                        <div class="stat-icon si-purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        </div>
                    </div>
                    <div class="stat-label">Clientes únicos</div>
                    <div class="stat-val" id="statClientes">—</div>
                    <div class="stat-sub" id="statClientesSub">este mes</div>
                </div>
            </div>

            <div class="dashboard-grid">
                <!-- Ingresos chart -->
                <div class="chart-wrap">
                    <div class="chart-header">
                        <h3>Ingresos últimos 7 días</h3>
                        <span class="card-header-sub" id="totalSemana">—</span>
                    </div>
                    <div id="listaIngresosSemana">
                        <div class="loading-state"><div class="spinner"></div></div>
                    </div>
                </div>

                <!-- Pendientes de aprobar -->
                <div class="card" style="margin-bottom:0">
                    <div class="card-header">
                        <h3>Pendientes de aprobar</h3>
                        <span class="badge badge-danger" id="badgePendientes" style="display:none">0</span>
                    </div>
                    <div id="listaPendientes">
                        <div class="loading-state"><div class="spinner"></div></div>
                    </div>
                    <div style="padding:10px 14px;border-top:1px solid var(--border)">
                        <a href="/propietario/reservas" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center">
                            Ver todas las reservas →
                        </a>
                    </div>
                </div>
            </div>

            <!-- Ocupación hoy -->
            <div class="card">
                <div class="card-header">
                    <h3>Ocupación de hoy</h3>
                    <span class="card-header-sub" id="fechaOcupacion">—</span>
                </div>
                <div class="card-body" id="ocupacionList">
                    <div class="loading-state"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/api.js"></script>
<script src="/propietario/shared/propietario.js"></script>
<script src="/propietario/dashboard/dashboard.js"></script>
</body>
</html>
