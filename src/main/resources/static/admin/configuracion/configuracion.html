<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SportSpace — Configuracion</title>
    <link rel="stylesheet" href="/admin/shared/admin.css"/>
    <link rel="stylesheet" href="/admin/configuracion/configuracion.css"/>
</head>
<body>


<div class="toast-container" id="toastContainer"></div>

<!-- confirmacion -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:380px">
        <div class="modal-header">
            <h3>Confirmar accion</h3>
            <button class="modal-close" onclick="closeModal('confirmModal')">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirmMsg" style="font-size:13.5px;color:var(--text2);line-height:1.6"></p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Cancelar</button>
            <button class="btn btn-danger" id="confirmOk">Confirmar</button>
        </div>
    </div>
</div>

<div class="layout">

    <!-- sidebra  -->
    <div id="sidebar-container"></div>

    <!-- main -->
    <div class="main">

        <!-- header -->
        <header class="header">
            <div class="header-left">
                <button class="hamburger" id="hamburger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6"  x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="breadcrumb">
                    <span class="bc-root">Admin</span>
                    <span class="bc-sep">›</span>
                    <span class="bc-page" id="bcPage">Configuracion</span>
                </div>
            </div>
            <div class="header-right">
                <div class="np-wrap">
                    <button class="notif-btn" id="notifBtn" title="Notificaciones">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notif-dot" id="notifDot" style="display:none"></span>
                        <span class="np-badge" id="notifBadge" style="display:none">!</span>
                    </button>
                    <div class="np-panel" id="notifPanel">
                        <div class="np-header">
                            <span class="np-title">Notificaciones</span>
                        </div>
                        <div class="np-list" id="notifPanelList">
                            <div class="np-empty">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                                </svg>
                                <span>Cargando...</span>
                            </div>
                        </div>
                        <div class="np-footer">
                            <a href="/admin/configuracion" class="np-cfg">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                </svg>
                                Configurar notificaciones
                            </a>
                        </div>
                    </div>
                </div>
                <div class="user-dropdown-wrap" id="userDropdownWrap">
                    <button class="header-user" id="headerUser">
                        <div class="header-avatar" id="headerAvatar">A</div>
                        <div class="header-user-info">
                            <div class="header-user-name" id="headerName">Cargando...</div>
                            <div class="header-user-role" id="headerRole">ADMIN</div>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-info">
                            <div class="dropdown-info-name"  id="dropName">—</div>
                            <div class="dropdown-info-role"  id="dropRole">—</div>
                            <div class="dropdown-info-email" id="dropEmail">—</div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" onclick="window.location.href='/admin/configuracion'">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                                         a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                                         A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                                         l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                                         A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                                         l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                                         a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                                         l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                                         a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                            Configuracion
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" onclick="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            Cerrar sesion
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- body -->
        <div class="page-body">

            <div class="page-header">
                <h1>Configuracion</h1>
                <p>Gestiona las notificaciones del sistema</p>
            </div>

            <!--  notificaicone -->
            <div class="card config-card">
                <div class="card-header">
                    <div class="config-card-title-wrap">
                        <div class="config-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                        </div>
                        <div>
                            <h3>Notificaciones del Sistema</h3>
                            <p class="config-subtitle">Activa o desactiva las notificaciones admin</p>
                        </div>
                    </div>
                    <div id="saveStatus"></div>
                </div>

                <div class="card-body" id="notifBody">
                    <div class="loading-center"><div class="spinner"></div></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/admin/shared/admin.js"></script>
<script src="/admin/configuracion/configuracion.js"></script>
</body>
</html>
