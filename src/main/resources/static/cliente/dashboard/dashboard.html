<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SportSpace — Inicio</title>
    <link rel="stylesheet" href="/cliente/shared/cliente.css"/>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div id="navbar-container"></div>

<div class="page-body">

    <!-- Bienvenida -->
    <div class="page-header-row" style="margin-top:6px">
        <div>
            <h1 id="welcomeMsg">Bienvenido</h1>
            <p id="fechaHoy" style="font-size:13px;color:var(--text3);margin-top:2px">—</p>
        </div>
        <a href="/cliente/buscar" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Buscar cancha
        </a>
    </div>

    <!-- Stats personales -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-card-top"><div class="stat-icon si-blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </div></div>
            <div class="stat-label">Reservas activas</div>
            <div class="stat-val" id="statActivas">—</div>
            <div class="stat-sub">pendientes y confirmadas</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-top"><div class="stat-icon si-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </div></div>
            <div class="stat-label">Completadas</div>
            <div class="stat-val" id="statCompletadas">—</div>
            <div class="stat-sub">en total</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-top"><div class="stat-icon si-orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div></div>
            <div class="stat-label">Total gastado</div>
            <div class="stat-val" id="statGasto" style="font-size:18px">—</div>
            <div class="stat-sub">en reservas completadas</div>
        </div>
    </div>

    <!-- Próximas reservas -->
    <div class="card">
        <div class="card-header">
            <h3>Próximas reservas</h3>
            <a href="/cliente/reservas" class="btn btn-secondary btn-sm">Ver todas →</a>
        </div>
        <div class="card-body" id="proximasWrap">
            <div class="loading-state"><div class="spinner"></div> Cargando…</div>
        </div>
    </div>

    <!-- Canchas sugeridas -->
    <div class="section-header" style="margin-top:8px">
        <h2>Canchas disponibles</h2>
        <a href="/cliente/buscar" style="font-size:12.5px;color:var(--accent);font-weight:500">Ver todas →</a>
    </div>
    <div class="canchas-grid" id="sugeridosGrid">
        <div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div> Cargando canchas…</div>
    </div>

</div>

<!-- MODAL RESERVA (inyectado dinámicamente por buscar.js) -->
<div id="modal-reserva-container"></div>

<script src="/api.js"></script>
<script src="/shared/cloudinary.js"></script>   <!-- ← nuevo, después de api.js -->
<script src="/cliente/shared/cliente.js"></script>
<script src="/cliente/dashboard/dashboard.js"></script>
</body>
</html>
