server.port=8080

# bd
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.application.name=sportspace

# api reniec / c.e
factiliza.api.url=${FACTILIZA_API_URL}
factiliza.api.token=${FACTILIZA_API_TOKEN}


# google apps script - envio de correos usando tu propio gmail (sin aprobacion de terceros)
appsscript.url=${APPSSCRIPT_URL}
appsscript.secret=${APPSSCRIPT_SECRET}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080}